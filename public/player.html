<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Werewolf Player</title>

<style>

body{
    margin:0;
    padding:20px;
    min-height:100vh;
    background:
    linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=1200&auto=format&fit=crop");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
    font-family:sans-serif;
}

.card{
    background:rgba(20,20,20,.82);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border-radius:24px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:
    0 0 25px rgba(0,0,0,.45),
    0 0 50px rgba(124,58,237,.12);
    animation:fade .5s ease;
}

h2,h3{
    margin-top:0;
    color:#e5e7eb;
}

input{
    width:100%;
    padding:14px;
    margin-top:10px;
    margin-bottom:14px;
    border:none;
    border-radius:14px;
    background:#1f2937;
    color:white;
    box-sizing:border-box;
    outline:none;
    font-size:15px;
    transition:.2s;
}

input:focus{
    background:#374151;
    box-shadow:0 0 0 2px rgba(124,58,237,.5);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:16px;
    background:
    linear-gradient(135deg,#7c3aed,#4f46e5);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 0 18px rgba(124,58,237,.35);
}

button:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 0 28px rgba(124,58,237,.65);
}

#role{
    font-size:34px;
    font-weight:bold;
    margin-top:14px;
    color:#c084fc;
    text-shadow:0 0 16px rgba(192,132,252,.7);
}

.realRole{
    margin-top:14px;
    font-size:17px;
    color:#facc15;
    font-weight:bold;
}

.player{
    background:rgba(55,65,81,.78);
    border:1px solid rgba(255,255,255,.05);
    padding:14px;
    border-radius:16px;
    margin-bottom:12px;
    transition:.25s;
}

.player:hover{
    transform:translateY(-2px);
    background:rgba(75,85,99,.9);
}

.dead{
    opacity:.45;
    filter:grayscale(100%);
}

.status{
    font-size:14px;
    margin-top:6px;
    color:#d1d5db;
}

.small{
    opacity:.75;
    font-size:14px;
    line-height:1.7;
    color:#d1d5db;
}

.hidden{
    display:none;
}

#huntInfo{
    color:#fb7185;
    margin-top:10px;
    font-weight:bold;
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#4f46e5;
    border-radius:20px;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}
#chatBox{
    height:320px;
    overflow-y:auto;
    margin-bottom:14px;
    padding:12px;
    border-radius:18px;
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.06);
}

.chatRow{
    display:flex;
    gap:10px;
}

.chatRow input{
    margin:0;
}

.sendBtn{
    width:120px;
}

.msg{
    padding:10px 12px;
    border-radius:14px;
    margin-bottom:10px;
    animation:fade .2s ease;
    line-height:1.5;
    word-break:break-word;
}

.msgGlobal{
    background:rgba(59,130,246,.15);
    border:1px solid rgba(59,130,246,.25);
}

.msgWolf{
    background:rgba(239,68,68,.15);
    border:1px solid rgba(239,68,68,.25);
}

.msgHost{
    background:rgba(168,85,247,.15);
    border:1px solid rgba(168,85,247,.25);
}

.msgName{
    font-weight:bold;
    margin-bottom:4px;
}

.msgType{
    font-size:12px;
    opacity:.7;
}
.msgPrivate{
    background:
    rgba(34,197,94,.15);

    border:
    1px solid
    rgba(34,197,94,.25);
}

</style>

</head>
<body>

<div class="card">

    <h2>Join Game</h2>

    <input
        id="name"
        placeholder="ชื่อผู้เล่น"
    >

    <input
        id="room"
        placeholder="ROOM CODE"
    >

    <button onclick="join()">
        JOIN ROOM
    </button>

</div>

<div class="card">

    <div class="small">
        บทของคุณ
    </div>

    <div id="role">
        ?
    </div>

    <div
        id="realRole"
        class="realRole hidden"
    ></div>
<div
    id="huntInfo"
    class="realRole hidden"
></div>

</div>

<div class="card">

    <h3>
        ผู้เล่นในห้อง
    </h3>

    <div id="players"></div>

</div>

<div class="card">

    <h3>
        GAME CHAT
    </h3>

    <div id="chatBox"></div>

    <div class="chatRow">
<select id="chatType">

    <option value="global">
        🔵 แชทรวม
    </option>

    <option value="wolf">
        🔴 แชทหมาป่า
    </option>

</select>
        <input
            id="chatInput"
            placeholder="พิมพ์ข้อความ..."
            maxlength="200"
        >

        <button
            class="sendBtn"
            onclick="sendChat()"
        >
            SEND
        </button>

    </div>

    <div class="small">
        🔵 แชทรวม<br>
        🔴 แชทหมาป่า<br>
        🟣 ข้อความจากโฮสต์
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let joined = false;

let myRole = "";
const wolfRoles = [
    "หมาป่า",
    "ลูกหมาป่า",
    "หมาป่าขาว"
];

// JOIN ROOM
function join() {

    const playerName =
        document.getElementById("name")
        .value
        .trim();

    const roomCode =
        document.getElementById("room")
        .value
        .trim()
        .toUpperCase();

    if (!playerName) {

        alert("กรอกชื่อก่อน");
        return;

    }

    if (!roomCode) {

        alert("กรอก ROOM CODE");
        return;

    }

    socket.emit(
        "join_room",
        {
            roomId: roomCode,
            name: playerName
        },

        (res) => {

            if (res.error) {

                alert(
                    "ไม่พบห้อง"
                );

                return;

            }

            joined = true;

        }
    );

}

// ROLE RECEIVE
socket.on(
    "your_role",
    (data) => {
myRole = data.role;
    // ROLE DISPLAY
    document.getElementById("role")
        .innerHTML = `

        <div>
            ${data.displayRole}
        </div>

    `;

    // REAL ROLE
    const realRole =
        document.getElementById(
            "realRole"
        );

    // ถ้าสุ่ม
    if (
        data.displayRole !==
        data.role
    ) {

        realRole.classList
            .remove("hidden");

        realRole.innerHTML = `

            บทจริง:
            <b>${data.role}</b>

        `;

    }

    // ถ้าไม่สุ่ม
    else {

        realRole.classList
            .add("hidden");

    }
const huntInfo =
    document.getElementById(
        "huntInfo"
    );

if (
    data.huntTarget
) {

    huntInfo.classList
        .remove("hidden");

    huntInfo.innerHTML = `

        🎯 เป้าหมาย:
        <b>${data.huntTarget}</b>

    `;

}
else {

    huntInfo.classList
        .add("hidden");

    huntInfo.innerHTML = "";

}
const chatType =
    document.getElementById(
        "chatType"
    );

if (
    wolfRoles.includes(data.role)
) {

    chatType.innerHTML = `

        <option value="global">
            🔵 แชทรวม
        </option>

        <option value="wolf">
            🔴 แชทหมาป่า
        </option>

    `;

}
else {

    chatType.innerHTML = `

        <option value="global">
            🔵 แชทรวม
        </option>

    `;

}

});

// ROOM UPDATE
socket.on(
    "room_update",
    (roomData) => {

    const players =
        document.getElementById(
            "players"
        );

    players.innerHTML = "";

    roomData.players
    .filter(
        p => !p.isHost
    )
    .forEach((p) => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "player " +
            (
                !p.alive
                ? "dead"
                : ""
            );

        div.innerHTML = `

            <b>${p.name}</b>

            <div class="status">

                ${
                    p.alive
                    ? "🟢 ยังรอด"
                    : "🔴 ตายแล้ว"
                }

            </div>

        `;

        players.appendChild(div);

    });

});

// DISCONNECT
socket.on(
    "disconnect",
    () => {

    if (joined) {

        alert(
            "ขาดการเชื่อมต่อเซิร์ฟเวอร์"
        );

    }

});

// SEND CHAT
function sendChat() {

    const input =
        document.getElementById(
            "chatInput"
        );

    const text =
        input.value.trim();

    if (!text) return;

    const roomId =
        document.getElementById(
            "room"
        ).value
        .trim()
        .toUpperCase();

    const type =
    document.getElementById(
        "chatType"
    ).value;

socket.emit(
    "send_chat",
    {
        roomId,
        text,
        type
    }
);

    input.value = "";

}

// RECEIVE CHAT
socket.on("chat_message", (msg) => {

    // กรองแชทหมาป่าเหมือนเดิม
    if (
        msg.type === "wolf" &&
        !wolfRoles.includes(myRole) &&
        !msg.isHost
    ) return;

    const chatBox =
        document.getElementById("chatBox");

    const div =
        document.createElement("div");

    let className = "msg msgGlobal";

    if (msg.type === "wolf") {
        className = "msg msgWolf";
    }

    if (msg.isHost) {
        className = "msg msgHost";
    }

    // ✅ FIX: private ต้อง override ทุกอย่าง
    if (msg.type === "private") {
        className = "msg msgPrivate";
    }

    div.className = className;

    div.innerHTML = `
        <div class="msgName">
            ${msg.name}
        </div>

        <div>
            ${msg.text}
        </div>

        <div class="msgType">
            ${
                msg.type === "private"
                ? "🟣 PRIVATE"
                : msg.type === "wolf"
                ? "🐺 แชทหมาป่า"
                : "💬 แชทรวม"
            }
        </div>
    `;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
});

// ENTER SEND
document.addEventListener(
    "keydown",
    (e) => {

    if (
    e.key === "Enter" &&
    document.activeElement.id === "chatInput"
)  {

        sendChat();

    }

});



</script>

</body>
</html>
