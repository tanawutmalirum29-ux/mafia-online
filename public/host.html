<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Werewolf — ห้องควบคุม</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0a0d14;
    --panel:#12172380;
    --panel-solid:#141a26;
    --line:rgba(255,255,255,.07);
    --ink:#dbe0ec;
    --ink-dim:#8993a8;
    --moon:#7c5cff;
    --moon-soft:rgba(124,92,255,.16);
    --wolf:#ef4444;
    --wolf-soft:rgba(239,68,68,.14);
    --safe:#22c55e;
    --safe-soft:rgba(34,197,94,.14);
    --mark:#fbbf24;
    --mark-soft:rgba(251,191,36,.14);
    --r-sm:10px;
    --r-md:16px;
    --r-lg:22px;
}

*{
    box-sizing:border-box;
touch-action: manipulation;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(ellipse 900px 500px at 18% -10%, rgba(124,92,255,.16), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 0%, rgba(239,68,68,.10), transparent 55%),
        var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;
    font-weight:400;
    line-height:1.55;
}
body{
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

#room{
    cursor:pointer;
}

/* subtle starfield */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.35), transparent 40%),
        radial-gradient(1px 1px at 78% 8%, rgba(255,255,255,.25), transparent 40%),
        radial-gradient(1.5px 1.5px at 60% 32%, rgba(255,255,255,.3), transparent 40%),
        radial-gradient(1px 1px at 32% 64%, rgba(255,255,255,.2), transparent 40%),
        radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,.25), transparent 40%),
        radial-gradient(1.5px 1.5px at 8% 85%, rgba(255,255,255,.18), transparent 40%);
    opacity:.5;
    z-index:0;
}

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-thumb{
    background:var(--moon);
    border-radius:20px;
    opacity:.6;
}

::-webkit-scrollbar-track{
    background:transparent;
}

a, button, input, select{
    font-family:inherit;
}

:focus-visible{
    outline:2px solid var(--moon);
    outline-offset:2px;
    border-radius:8px;
}

@keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
}

@keyframes glowPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(124,92,255,.35); }
    50%{ box-shadow:0 0 0 10px rgba(124,92,255,0); }
}

@media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ================= LAYOUT ================= */

.app{
    position:relative;
    z-index:1;
    max-width:1280px;
    margin:0 auto;
    padding:28px 20px 80px;
}

/* ---- header / seal ---- */

.seal-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:34px;
    animation:rise .6s ease both;
}

.eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:14px;
}

.seal{
    position:relative;
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:22px 46px;
    border:1px solid var(--moon-soft);
    border-radius:999px;
    background:
        radial-gradient(ellipse at center, rgba(124,92,255,.14), transparent 70%),
        var(--panel);
    backdrop-filter:blur(10px);
}

.seal::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px dashed rgba(124,92,255,.35);
    border-radius:999px;
    pointer-events:none;
}

.seal-label{
    font-size:12px;
    letter-spacing:.2em;
    color:var(--ink-dim);
    text-transform:uppercase;
    font-family:"JetBrains Mono",monospace;
}

.seal-code{
    font-family:"Charm","IBM Plex Sans Thai",serif;
    font-weight:700;
    font-size:52px;
    letter-spacing:.18em;
    color:#fff;
    text-shadow:0 0 28px rgba(124,92,255,.55);
    line-height:1;
}

.seal-hint{
    font-size:13px;
    color:var(--ink-dim);
    margin-top:2px;
}

/* ---- grid ---- */

.layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:22px;
    align-items:start;
}

@media (max-width: 980px){
    .layout{
        grid-template-columns:1fr;
    }
}

.col{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.sticky{
    position:sticky;
    top:20px;
}

@media (max-width: 980px){
    .sticky{ position:static; }
}

/* ---- card ---- */

.card{
    background:var(--panel);
    border:1px solid var(--line);
    backdrop-filter:blur(12px);
    border-radius:var(--r-lg);
    padding:22px;
    animation:rise .5s ease both;
}

.card h2{
    margin:0 0 4px;
    font-family:"Charm","IBM Plex Sans Thai",serif;
    font-weight:700;
    font-size:22px;
    color:#fff;
    letter-spacing:.02em;
}

.card .sub{
    margin:0 0 16px;
    font-size:13px;
    color:var(--ink-dim);
}

.card h2 + .sub{
    margin-top:2px;
}

/* ---- form controls ---- */

select, .hostMsgInput{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    background:#0e1320;
    color:var(--ink);
    font-size:14px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
    appearance:none;
}

select:focus, .hostMsgInput:focus{
    border-color:var(--moon);
    box-shadow:0 0 0 3px var(--moon-soft);
}

select{
    background-image:
        linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),
        linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position:
        calc(100% - 18px) center,
        calc(100% - 13px) center;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    cursor:pointer;
}

/* buttons */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 18px;
    border:none;
    border-radius:var(--r-sm);
    background:linear-gradient(135deg,#7c5cff,#5b3df0);
    color:#fff;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s, filter .15s;
    box-shadow:0 4px 18px rgba(124,92,255,.28);
}

.btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.btn:active{
    transform:translateY(0);
}

.btn-block{
    width:100%;
}

.btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    box-shadow:none;
    color:var(--ink);
}

.btn-ghost:hover{
    border-color:var(--moon);
    background:var(--moon-soft);
}

.btn-danger{
    background:linear-gradient(135deg,#ef4444,#b91c1c);
    box-shadow:0 4px 18px rgba(239,68,68,.28);
}

/* role picker row */

.role-picker{
    display:flex;
    gap:10px;
    margin-bottom:14px;
}

.role-picker select{
    flex:1;
}

.role-picker .btn{
    width:auto;
    padding:12px 20px;
    white-space:nowrap;
}

/* role chips */

.roleConfigList{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.roleBox{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:#0e1320;
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    padding:10px 14px;
    animation:rise .3s ease both;
}

.roleBox .name{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:14px;
    font-weight:500;
}

.roleBox .count{
    font-family:"JetBrains Mono",monospace;
    color:var(--moon);
    font-size:13px;
}

.roleBox .btns{
    display:flex;
    gap:6px;
}

.roleBtn{
    width:30px;
    height:30px;
    padding:0;
    border:1px solid var(--line);
    border-radius:8px;
    background:#1a2133;
    color:var(--ink);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
    display:flex;
    align-items:center;
    justify-content:center;
}

.roleBtn:hover{
    border-color:var(--moon);
    color:#fff;
    background:var(--moon-soft);
}

.empty-note{
    font-size:13px;
    color:var(--ink-dim);
    padding:14px;
    border:1px dashed var(--line);
    border-radius:var(--r-sm);
    text-align:center;
}

/* role count badge */

.config-summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:.05em;
}

.config-summary b{
    color:var(--ink);
    font-weight:700;
}

/* ---- players grid ---- */

.players-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
}

.player{
    background:#0e1320;
    border:1px solid var(--line);
    border-radius:var(--r-md);
    padding:16px;
    transition:border-color .2s, transform .2s;
    animation:rise .35s ease both;
}

.player:hover{
    border-color:rgba(124,92,255,.35);
}

.player.dead{
    opacity:.5;
    filter:grayscale(60%);
}

.player .ptop{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    margin-bottom:4px;
}

.player .pname{
    font-weight:600;
    font-size:15px;
    color:#fff;
}

.player .prole{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--moon);
    background:var(--moon-soft);
    border:1px solid rgba(124,92,255,.3);
    border-radius:999px;
    padding:3px 10px;
    white-space:nowrap;
}

.randomRole{
    margin-top:6px;
    font-size:12px;
    color:#60a5fa;
}

.realRole{
    margin-top:4px;
    font-size:12px;
    color:var(--mark);
    font-weight:600;
}

.huntInfo{
    margin-top:6px;
    font-size:12px;
    color:var(--wolf);
    font-weight:600;
}

.selectionInfo{
    margin-top:10px;
    font-size:12px;
    color:var(--ink-dim);
    padding:6px 10px;
    border-radius:8px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
}

.flags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.flag{
    font-size:11px;
    padding:3px 9px;
    border-radius:999px;
    font-weight:600;
    letter-spacing:.02em;
}

.flag.protect{ background:var(--safe-soft); color:var(--safe); border:1px solid rgba(34,197,94,.3); }
.flag.killed{ background:var(--wolf-soft); color:var(--wolf); border:1px solid rgba(239,68,68,.3); }
.flag.silenced{ background:rgba(148,163,184,.14); color:#94a3b8; border:1px solid rgba(148,163,184,.3); }
.flag.transformed{ background:var(--mark-soft); color:var(--mark); border:1px solid rgba(251,191,36,.3); }

/* preset messages */

.roleMessages{
    margin-top:12px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.presetBtn{
    font-size:12px;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid rgba(124,92,255,.35);
    background:var(--moon-soft);
    color:#cdbfff;
    cursor:pointer;
    transition:.15s;
    font-family:"IBM Plex Sans Thai",sans-serif;
}

.presetBtn:hover{
    background:var(--moon);
    color:#fff;
    border-color:var(--moon);
}

/* toggles */

.toggles{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
}

.toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--ink-dim);
    cursor:pointer;
    user-select:none;
}

.toggle input{
    appearance:none;
    width:16px;
    height:16px;
    border:1px solid var(--line);
    border-radius:5px;
    background:#1a2133;
    cursor:pointer;
    position:relative;
    transition:.15s;
    flex-shrink:0;
}

.toggle input:checked{
    background:var(--moon);
    border-color:var(--moon);
}

.toggle input:checked::after{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:#fff;
}

.toggle:hover{
    color:var(--ink);
}

/* ---- chat ---- */

.chat-controls{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:10px;
}

.chat-controls select{
    width:100%;
}

.chat-controls .chat-input-row{
    display:flex;
    gap:8px;
    align-items:center;
}

.chat-controls input{
    flex:1;
}

.chat-controls .chat-input-row .btn{
    flex:0 0 72px;
    padding:12px 10px;
}

.chat-log{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:320px;
    overflow-y:auto;
    padding-right:4px;
}

.chat-log:empty::after{
    content:"ยังไม่มีข้อความ — ส่งข้อความแรกของคืนนี้";
    display:block;
    text-align:center;
    color:var(--ink-dim);
    font-size:13px;
    padding:24px 0;
    border:1px dashed var(--line);
    border-radius:var(--r-sm);
}

.msg{
    border-radius:var(--r-sm);
    padding:10px 12px;
    font-size:13px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.02);
    animation:rise .25s ease both;
}

.msg.wolf{
    background:var(--wolf-soft);
    border-color:rgba(239,68,68,.25);
}

.msg.global{
    background:rgba(59,130,246,.12);
    border-color:rgba(59,130,246,.25);
}

.msg.private{
    background:var(--safe-soft);
    border-color:rgba(34,197,94,.3);
}

.msg.host{
    background:var(--moon-soft);
    border-color:rgba(124,92,255,.3);
}

.msg .mname{
    font-weight:700;
    color:#fff;
    margin-bottom:2px;
    font-size:12px;
}

.msg .mtype{
    margin-top:4px;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
}

.btn-vote{
    background:linear-gradient(135deg,#f59e0b,#d97706);
    box-shadow:0 4px 18px rgba(245,158,11,.28);
}

.btn-vote.active{
    background:linear-gradient(135deg,#22c55e,#15803d);
    box-shadow:0 4px 18px rgba(34,197,94,.3);
    animation:glowPulse 2s infinite;
}

.vote-panel{
    margin-top:16px;
    padding:14px;
    background:rgba(245,158,11,.07);
    border:1px solid rgba(245,158,11,.25);
    border-radius:var(--r-md);
}

.vote-panel.active{
    background:rgba(34,197,94,.07);
    border-color:rgba(34,197,94,.25);
}

.vote-panel-title{
    font-size:12px;
    font-family:"JetBrains Mono",monospace;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:10px;
}

.vote-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 12px;
    background:#0e1320;
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    margin-bottom:6px;
    font-size:13px;
}

.vote-row .vote-name{
    font-weight:600;
    color:#fff;
}

.vote-row .vote-target{
    color:var(--ink-dim);
    font-size:12px;
}

.vote-tally{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
}

.tally-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 12px;
    border-radius:var(--r-sm);
    margin-bottom:5px;
    font-size:13px;
    background:#0e1320;
    border:1px solid var(--line);
}

.tally-count{
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
    font-weight:700;
    padding:2px 10px;
    border-radius:999px;
    background:rgba(239,68,68,.15);
    color:var(--wolf);
    border:1px solid rgba(239,68,68,.3);
}

.tally-row.top-voted{
    border-color:rgba(239,68,68,.4);
    background:rgba(239,68,68,.07);
}


    margin-top:4px;
}

.divider{
    height:1px;
    background:var(--line);
    margin:18px 0;
    border:none;
}

</style>

</head>
<body>

<div class="app">

    <!-- ===== SEAL / ROOM CODE ===== -->
    <div class="seal-wrap">
        <div class="eyebrow">ห้องควบคุมผู้เล่าเรื่อง</div>
        <div class="seal">
            <span class="seal-label">รหัสห้อง</span>
            <span class="seal-code" id="room">••••</span>
        </div>
        <div class="seal-hint">บอกรหัสนี้กับผู้เล่นเพื่อเข้าร่วมห้อง</div>
    </div>

    <div class="layout">

        <!-- ===== LEFT COLUMN ===== -->
        <div class="col">

            <div class="card">
                <h2>ตั้งค่าบทบาท</h2>
                <p class="sub">เลือกบทบาทและจำนวนให้ตรงกับผู้เล่นในห้อง</p>

                <div class="role-picker">
                    <select id="roleSelect"></select>
                    <button class="btn" onclick="addRole()">+ เพิ่ม</button>
                </div>

                <div class="config-summary">
                    <span>รายการบทบาท</span>
                    <span>รวม <b id="roleTotal">0</b> ใบ</span>
                </div>

                <div id="roles" class="roleConfigList"></div>

                <hr class="divider">

                <button class="btn btn-block" onclick="startGame()">
                    🌙 เริ่มเกม
                </button>

                <hr class="divider">

                <button class="btn btn-block btn-vote" id="voteBtn" onclick="toggleVoteMode()">
                    🗳️ เปิดโหมดโหวต
                </button>

                <div class="vote-panel hidden" id="votePanel">
                    <div class="vote-panel-title">📋 การโหวต</div>
                    <div id="voteRows"></div>
                    <div class="vote-tally" id="voteTally"></div>
                </div>
            </div>

        </div>

        <!-- ===== RIGHT COLUMN ===== -->
        <div class="col">

            <div class="card">
                <h2>ผู้เล่นในห้อง</h2>
                <p class="sub">แตะปุ่มสถานะเพื่ออัปเดตให้ผู้เล่นเห็นทันที</p>

                <div id="list" class="players-grid"></div>
            </div>

            <div class="card sticky">
                <h2>แชท</h2>
                <p class="sub">ผู้เล่าเรื่องเห็นทุกแชท — รวม, หมาป่า, และส่วนตัว</p>

                <div class="chat-controls">
                    <select id="chatType">
                        <option value="global">🔵 แชทรวม</option>
                        <option value="wolf">🔴 เฉพาะหมาป่า</option>
                    </select>

                    <div class="chat-input-row">
                        <input
                            id="hostMsg"
                            class="hostMsgInput"
                            placeholder="พิมพ์ข้อความจากผู้เล่าเรื่อง..."
                        >

                        <button class="btn" onclick="sendHostMsg()">ส่ง</button>
                    </div>
                </div>

                <div id="chatLog" class="chat-log"></div>
            </div>

        </div>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>


<script>

const socket = io();

let roomId = "";
let currentRoom = null;


const roleConfig = {};

const hostName = "Admin676767";

let roles = {}; // cache ฝั่ง client

socket.on("roles_data", (data) => {

    // เก็บข้อมูล roles ทั้งหมดไว้ใช้ทั้งระบบ
    roles = data || {};

    const select = document.getElementById("roleSelect");

    if (!select) return; // กัน DOM ไม่พร้อม
