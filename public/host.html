<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Werewolf Host</title>

<style>

body{
    margin:0;
    padding:20px;
    background:
    linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=1200&auto=format&fit=crop");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
    font-family:sans-serif;
    min-height:100vh;
}

.card{
    background:rgba(20,20,20,.82);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border-radius:24px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:
    0 0 25px rgba(0,0,0,.45),
    0 0 50px rgba(124,58,237,.12);
    animation:fade .5s ease;
}

h1{
    margin-top:0;
    font-size:40px;
    letter-spacing:2px;
    color:white;
}

h2{
    color:#d1d5db;
    margin-bottom:14px;
}

button{
    padding:12px 16px;
    border:none;
    border-radius:14px;
    background:
    linear-gradient(135deg,#7c3aed,#4f46e5);
    color:white;
    cursor:pointer;
    margin:5px;
    font-weight:bold;
    transition:.25s;
    box-shadow:0 0 18px rgba(124,58,237,.35);
}


button:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 0 28px rgba(124,58,237,.65);
}

select{
    padding:12px;
    border:none;
    border-radius:14px;
    background:#1f2937;
    color:white;
    font-size:15px;
    outline:none;
    margin-bottom:10px;
}

.player{
    background:rgba(55,65,81,.78);
    border:1px solid rgba(255,255,255,.05);
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
    transition:.25s;
}

.player:hover{
    transform:translateY(-2px);
    background:rgba(75,85,99,.88);
}

.dead{
    opacity:.45;
    filter:grayscale(100%);
}

.roleBox{
    display:flex;
    align-items:center;
    justify-content:space-between;

    width:100%;
    max-width:250px; /* ปรับความยาวกล่อง */

    background:rgba(55,65,81,.75);
    border-radius:16px;

    padding:10px 14px; /* ปรับความอ้วนกล่อง */

    margin-top:10px;

    border:1px solid rgba(255,255,255,.05);
}

.roleBtn{
    width:34px; /* ขนาดปุ่ม */
    height:34px;

    padding:0;
    margin:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:10px;

    background:
    linear-gradient(135deg,#7c3aed,#4f46e5);

    color:white;

    font-size:18px; /* ขนาด + - */

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.roleBtn:hover{
    transform:scale(1.08);
}


.realRole{
    color:#facc15;
    margin-top:8px;
    font-size:14px;
    font-weight:bold;
}

.randomRole{
    color:#60a5fa;
    margin-top:6px;
    font-size:14px;
}

#room{
    color:#c084fc;
    text-shadow:0 0 12px rgba(192,132,252,.8);
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#4f46e5;
    border-radius:20px;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}
.msgPrivate{
    background:
    rgba(34,197,94,.15);

    border:
    1px solid
    rgba(34,197,94,.25);
}
</style>

</head>
<body>

<div class="card">

    <h1>HOST PANEL</h1>

    <h2>
        ROOM:
        <span id="room">...</span>
    </h2>

</div>

<div class="card">

    <h2>ROLE CONFIG</h2>

    <select id="roleSelect">

        <option value="หมาป่า">
            หมาป่า
        </option>

        <option value="หมอ">
            หมอ
        </option>

        <option value="เซียร์">
            เซียร์
        </option>

        <option value="บอดี้การ์ด">
            บอดี้การ์ด
        </option>

        <option value="นักล่า">
            นักล่า
        </option>

        <option value="แม่มด">
            แม่มด
        </option>

        <option value="ชาวบ้าน">
            ชาวบ้าน
        </option>

        <option value="สุ่มชาวบ้าน">
            สุ่มชาวบ้าน
        </option>

        <option value="สุ่มหมาป่า">
            สุ่มหมาป่า
        </option>

        <option value="สุ่มบทบาทการโหวต">
            สุ่มบทบาทการโหวต
        </option>

    </select>

    <button onclick="addRole()">
        ADD ROLE
    </button>

    <div id="roles"></div>

    <br>

    <button onclick="startGame()">
        START GAME
    </button>

</div>

<div class="card">

    <h2>PLAYERS</h2>

    <div id="list"></div>

</div>
<div class="card">

    <h2>
        HOST CHAT
    </h2>

    <select id="chatType">

        <option value="global">
            แชทรวม
        </option>

        <option value="wolf">
            เฉพาะหมาป่า
        </option>

    </select>

    <input
        id="hostMsg"
        placeholder="ข้อความจากโฮสต์..."
    >

    <button onclick="sendHostMsg()">
        SEND MESSAGE
    </button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let roomId = "";

const roleConfig = {};

const hostName = "Admin676767";
const roleMessages = {

    "หมอ":[
        "คืนนี้เลือกคนที่จะรักษา",
        "คุณช่วยตัวเองได้",
        "คืนนี้ไม่มีคนตาย"
    ],

    "เซียร์":[
        "คืนนี้เลือกคนที่จะส่อง",
        "คนนี้เป็นฝ่ายดี",
        "คนนี้เป็นฝ่ายร้าย"
    ],

    "หมาป่า":[
        "เลือกเหยื่อคืนนี้",
        "รอหมาป่าตัวอื่นโหวต"
    ],

    "นักล่า":[
        "เป้าหมายของคุณยังมีชีวิต",
        "คุณชนะทันทีถ้าเป้าหมายตาย"
    ]

};

// CREATE ROOM
socket.emit(
    "create_room",
    {
        name: hostName
    },

    (id) => {

        roomId = id;

        document
        .getElementById("room")
        .innerText = id;

    }
);

// ROOM UPDATE
socket.on(
    "room_update",
    (room) => {

    const list =
        document.getElementById(
            "list"
        );

    list.innerHTML = "";

    room.players.forEach((p) => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "player " +
            (
                !p.alive
                ? "dead"
                : ""
            );

        div.innerHTML = `

            <b>
                ${p.name}
            </b>

            <br><br>

            ROLE:
            ${
                p.role
                || "?"
            }

            ${
                p.displayRole &&
                p.displayRole !== p.role

                ?

                `

                <div class="randomRole">

                    สุ่มจาก:
                    ${p.displayRole}

                </div>

                <div class="realRole">

                    บทจริง:
                    ${p.role}

                </div>

                `

                :

                ""
            }
${
    p.huntTarget

    ?

    `

    <div class="realRole">

        🎯 เป้าหมาย:
        ${p.huntTarget}

    </div>

    `

    :

    ""
}

            <br>

            ${
                p.alive
                ? "🟢 ALIVE"
                : "🔴 DEAD"
            }

            <br>

            ${
                p.protected
                ? "🛡 PROTECTED"
                : ""
            }

            ${
                p.killed
                ? "☠ MARKED"
                : ""
            }

            <br><br>

<button
    onclick="
    toggle(
        '${p.id}',
        'alive'
    )"
>
    DEAD
</button>

<button
    onclick="
    toggle(
        '${p.id}',
        'protected'
    )"
>
    PROTECT
</button>

<button
    onclick="
    toggle(
        '${p.id}',
        'killed'
    )"
>
    MARK
</button>

${
    roleMessages[p.role]

    ?

    `

    <hr style="
        border-color:rgba(255,255,255,.08);
        margin:14px 0;
    ">

    <div>
        <b>
            QUICK MESSAGE
        </b>
    </div>

    ${roleMessages[p.role]
        .map(msg => `

        <button
            class="msgPrivate"
            onclick="
                sendPreset(
                    '${p.id}',
                    \`${msg}\`
                )
            "
        >
            ${msg}
        </button>

        `)
        .join("")
    }

    `

    :

    ""
}

            

        `;

        list.appendChild(div);

    });

});

// HOST ERROR
socket.on(
    "host_error",
    (msg) => {

        alert(msg);

    }
);

// ROLE UI
function renderRoles() {

    const rolesDiv =
        document.getElementById(
            "roles"
        );

    rolesDiv.innerHTML = "";

    Object.keys(roleConfig)
    .forEach((role) => {

        if (
            roleConfig[role] <= 0
        ) {

            delete roleConfig[
                role
            ];

            return;

        }

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "roleBox";

        div.innerHTML = `

            <div style="
                display:flex;
                align-items:center;
                gap:10px;
            ">

                <b>
                    ${role}
                </b>

                <span>
                    x${roleConfig[role]}
                </span>

            </div>

            <div style="
                display:flex;
                gap:8px;
            ">

                <button
                    class="roleBtn"
                    onclick="
                    changeRole(
                        '${role}',
                        1
                    )"
                >
                    +
                </button>

                <button
                    class="roleBtn"
                    onclick="
                    changeRole(
                        '${role}',
                        -1
                    )"
                >
                    -
                </button>

            </div>

        `;

        rolesDiv.appendChild(div);

    });

}

// ADD ROLE
function addRole() {

    const role =
        document.getElementById(
            "roleSelect"
        ).value;

    if (!roleConfig[role]) {

        roleConfig[role] = 1;

    }

    else {

        roleConfig[role]++;

    }

    renderRoles();

    updateConfig();

}

// CHANGE ROLE
function changeRole(
    role,
    amount
) {

    if (
        !roleConfig[role]
    ) return;

    roleConfig[role] += amount;

    if (
        roleConfig[role] <= 0
    ) {

        delete roleConfig[
            role
        ];

    }

    renderRoles();

    updateConfig();

}

// UPDATE CONFIG
function updateConfig() {

    socket.emit(
        "update_config",
        {
            roomId,
            config: roleConfig
        }
    );

}

// START GAME
function startGame() {

    socket.emit(
        "start_game",
        roomId
    );

}

// TOGGLE
function toggle(
    playerId,
    key
) {

    socket.emit(
        "toggle_state",
        {
            roomId,
            playerId,
            key
        }
    );

}
function sendHostMsg() {

    const text =
        document.getElementById(
            "hostMsg"
        ).value
        .trim();

    const type =
        document.getElementById(
            "chatType"
        ).value;

    if (!text) return;

    socket.emit(
        "host_chat",
        {
            roomId,
            text,
            type
        }
    );

    document.getElementById(
        "hostMsg"
    ).value = "";

}
function sendPreset(
    playerId,
    text
) {

    socket.emit(
        "host_private_msg",
        {
            roomId,
            playerId,
            text
        }
    );

}

</script>

</body>
</html>
