<!DOCTYPE html>
<html>
<body>

<h1>HOST PANEL</h1>

<h2>
ROOM CODE:
<span id="room">...</span>
</h2>

<hr>

<h3>ROLE CONFIG</h3>

<p>
หมาป่า:
<input id="wolf" type="number" value="1" min="0">
</p>

<p>
หมอ:
<input id="doctor" type="number" value="1" min="0">
</p>

<button onclick="updateConfig()">
UPDATE ROLES
</button>

<button onclick="startGame()">
START GAME
</button>

<hr>

<h2>PLAYERS</h2>

<ul id="list"></ul>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let roomId = "";

const hostName =
    prompt("ชื่อโฮสต์") || "HOST";

// CREATE ROOM
socket.emit(
    "create_room",
    {
        name: hostName
    },
    (id) => {

        roomId = id;

        document.getElementById("room").innerText =
            roomId;

    }
);

// ROOM UPDATE
socket.on("room_update", (room) => {

    const list =
        document.getElementById("list");

    list.innerHTML = "";

    room.players.forEach((p) => {

        const li =
            document.createElement("li");

        li.innerHTML = `
            <hr>

            <b>${p.name}</b>

            <br>

            ROLE:
            ${p.role || "?"}

            <br>

            STATUS:
            ${p.alive ? "🟢 ALIVE" : "🔴 DEAD"}

            <br>

            ${p.protected ? "🛡 PROTECTED" : ""}

            ${p.killed ? "☠ MARKED" : ""}

            <br><br>

            <button onclick="toggle('${p.id}','alive')">
                TOGGLE DEAD
            </button>

            <button onclick="toggle('${p.id}','protected')">
                TOGGLE PROTECT
            </button>

            <button onclick="toggle('${p.id}','killed')">
                TOGGLE KILLED
            </button>
        `;

        list.appendChild(li);

    });

});

// UPDATE CONFIG
function updateConfig() {

    const wolfCount =
        Number(
            document.getElementById("wolf").value
        );

    const doctorCount =
        Number(
            document.getElementById("doctor").value
        );

    socket.emit(
        "update_config",
        {
            roomId,

            config: {
                wolf: wolfCount,
                doctor: doctorCount
            }
        }
    );

}

// START GAME
function startGame() {

    socket.emit(
        "start_game",
        roomId
    );

}

// TOGGLE
function toggle(playerId, key) {

    socket.emit(
        "toggle_state",
        {
            roomId,
            playerId,
            key
        }
    );

}
</script>

</body>
</html>
