<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Werewolf Host</title>

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:sans-serif;
    padding:20px;
}

.card{
    background:#1f2937;
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    margin:4px;
}

button:hover{
    opacity:0.9;
}

select{
    padding:10px;
    border:none;
    border-radius:10px;
    background:#374151;
    color:white;
}

.player{
    background:#374151;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
}

.dead{
    opacity:0.5;
}

.roleBox{
    background:#374151;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
}

</style>

</head>
<body>

<div class="card">

    <h1>HOST PANEL</h1>

    <h2>
        ROOM:
        <span id="room">...</span>
    </h2>

</div>

<div class="card">

    <h2>ROLE CONFIG</h2>

    <select id="roleSelect">

        <option value="หมาป่า">หมาป่า</option>
        <option value="หมอ">หมอ</option>
        <option value="เซียร์">เซียร์</option>
        <option value="บอดี้การ์ด">บอดี้การ์ด</option>
        <option value="นักล่า">นักล่า</option>
        <option value="แม่มด">แม่มด</option>
        <option value="ชาวบ้าน">ชาวบ้าน</option>
<option value="สุ่มชาวบ้าน">
    สุ่มชาวบ้าน
</option>

<option value="สุ่มหมาป่า">
    สุ่มหมาป่า
</option>

<option value="สุ่มบทบาทการโหวต">
    สุ่มบทบาทการโหวต
</option>

    </select>

    <button onclick="addRole()">
        ADD ROLE
    </button>

    <div id="roles"></div>

    <br>

    <button onclick="updateConfig()">
        UPDATE ROLES
    </button>

    <button onclick="startGame()">
        START GAME
    </button>

</div>

<div class="card">

    <h2>PLAYERS</h2>

    <div id="list"></div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let roomId = "";

const roleConfig = {};

const hostName =
    prompt("ชื่อโฮสต์") || "HOST";

// CREATE ROOM
socket.emit(
    "create_room",
    {
        name: hostName
    },

    (id) => {

        roomId = id;

        document.getElementById("room")
            .innerText = roomId;

    }
);

// ROOM UPDATE
socket.on("room_update", (room) => {

    const list =
        document.getElementById("list");

    list.innerHTML = "";

    room.players.forEach((p) => {

        const div =
            document.createElement("div");

        div.className =
            "player " +
            (!p.alive ? "dead" : "");

        div.innerHTML = `

            <b>${p.name}</b>

            <br><br>

            ROLE:
            ${p.role || "?"}

            <br><br>

            ${
                p.alive
                ? "🟢 ALIVE"
                : "🔴 DEAD"
            }

            <br>

            ${
                p.protected
                ? "🛡 PROTECTED"
                : ""
            }

            ${
                p.killed
                ? "☠ MARKED"
                : ""
            }

            <br><br>

            <button onclick="toggle('${p.id}','alive')">
                DEAD
            </button>

            <button onclick="toggle('${p.id}','protected')">
                PROTECT
            </button>

            <button onclick="toggle('${p.id}','killed')">
                MARK
            </button>

        `;

        list.appendChild(div);

    });

});
socket.on("host_error", (msg) => {

    alert(msg);

});

// ROLE UI
function renderRoles() {

    const rolesDiv =
        document.getElementById("roles");

    rolesDiv.innerHTML = "";

    Object.keys(roleConfig).forEach((role) => {

        if (roleConfig[role] <= 0) {

            delete roleConfig[role];
            return;

        }

        const div =
            document.createElement("div");

        div.className = "roleBox";

        div.innerHTML = `

            <b>${role}</b>

            x${roleConfig[role]}

            <button onclick="changeRole('${role}',1)">
                +
            </button>

            <button onclick="changeRole('${role}',-1)">
                -
            </button>

        `;

        rolesDiv.appendChild(div);

    });

}

// ADD ROLE
function addRole() {

    const role =
        document.getElementById("roleSelect").value;

    if (!roleConfig[role]) {

        roleConfig[role] = 1;

    } else {

        roleConfig[role]++;

    }

    renderRoles();

}

// CHANGE ROLE
function changeRole(role, amount) {

    if (!roleConfig[role]) return;

    roleConfig[role] += amount;

    if (roleConfig[role] <= 0) {

        delete roleConfig[role];

    }

    renderRoles();

}

// UPDATE CONFIG
function updateConfig() {

    socket.emit(
        "update_config",
        {
            roomId,
            config: roleConfig
        }
    );

}

// START GAME
function startGame() {

    socket.emit(
        "start_game",
        roomId
    );

}

// TOGGLE
function toggle(playerId, key) {

    socket.emit(
        "toggle_state",
        {
            roomId,
            playerId,
            key
        }
    );

}

</script>

</body>
</html>
