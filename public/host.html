<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Werewolf — ห้องควบคุม</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0a0d14;
    --panel:#12172380;
    --panel-solid:#141a26;
    --line:rgba(255,255,255,.07);
    --ink:#dbe0ec;
    --ink-dim:#8993a8;
    --moon:#7c5cff;
    --moon-soft:rgba(124,92,255,.16);
    --wolf:#ef4444;
    --wolf-soft:rgba(239,68,68,.14);
    --safe:#22c55e;
    --safe-soft:rgba(34,197,94,.14);
    --mark:#fbbf24;
    --mark-soft:rgba(251,191,36,.14);
    --r-sm:10px;
    --r-md:16px;
    --r-lg:22px;
}

*{
    box-sizing:border-box;
touch-action: manipulation;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(ellipse 900px 500px at 18% -10%, rgba(124,92,255,.16), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 0%, rgba(239,68,68,.10), transparent 55%),
        var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;
    font-weight:400;
    line-height:1.55;
}
body{
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

#room{
    cursor:pointer;
}

/* subtle starfield */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.35), transparent 40%),
        radial-gradient(1px 1px at 78% 8%, rgba(255,255,255,.25), transparent 40%),
        radial-gradient(1.5px 1.5px at 60% 32%, rgba(255,255,255,.3), transparent 40%),
        radial-gradient(1px 1px at 32% 64%, rgba(255,255,255,.2), transparent 40%),
        radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,.25), transparent 40%),
        radial-gradient(1.5px 1.5px at 8% 85%, rgba(255,255,255,.18), transparent 40%);
    opacity:.5;
    z-index:0;
}

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-thumb{
    background:var(--moon);
    border-radius:20px;
    opacity:.6;
}

::-webkit-scrollbar-track{
    background:transparent;
}

a, button, input, select{
    font-family:inherit;
}

:focus-visible{
    outline:2px solid var(--moon);
    outline-offset:2px;
    border-radius:8px;
}

@keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
}

@keyframes glowPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(124,92,255,.35); }
    50%{ box-shadow:0 0 0 10px rgba(124,92,255,0); }
}

@media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ================= LAYOUT ================= */

.app{
    position:relative;
    z-index:1;
    max-width:1280px;
    margin:0 auto;
    padding:28px 20px 110px;
}

/* ---- header / seal ---- */

.seal-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:34px;
    animation:rise .6s ease both;
}

.eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:14px;
}

.seal{
    position:relative;
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:22px 46px;
    border:1px solid var(--moon-soft);
    border-radius:999px;
    background:
        radial-gradient(ellipse at center, rgba(124,92,255,.14), transparent 70%),
        var(--panel);
    backdrop-filter:blur(10px);
}

.seal::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px dashed rgba(124,92,255,.35);
    border-radius:999px;
    pointer-events:none;
}

.seal-label{
    font-size:12px;
    letter-spacing:.2em;
    color:var(--ink-dim);
    text-transform:uppercase;
    font-family:"JetBrains Mono",monospace;
}

.seal-code{
    font-family:"Charm","IBM Plex Sans Thai",serif;
    font-weight:700;
    font-size:52px;
    letter-spacing:.18em;
    color:#fff;
    text-shadow:0 0 28px rgba(124,92,255,.55);
    line-height:1;
}

.seal-hint{
    font-size:13px;
    color:var(--ink-dim);
    margin-top:2px;
}

/* ---- grid ---- */

.layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:22px;
    align-items:start;
}

@media (max-width: 980px){
    .layout{
        grid-template-columns:1fr;
    }
}

.col{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.sticky{
    position:sticky;
    top:20px;
}

@media (max-width: 980px){
    .sticky{ position:static; }
}

/* ---- card ---- */

.card{
    background:var(--panel);
    border:1px solid var(--line);
    backdrop-filter:blur(12px);
    border-radius:var(--r-lg);
    padding:22px;
    animation:rise .5s ease both;
}

.card h2{
    margin:0 0 4px;
    font-family:"Charm","IBM Plex Sans Thai",serif;
    font-weight:700;
    font-size:22px;
    color:#fff;
    letter-spacing:.02em;
}

.card .sub{
    margin:0 0 16px;
    font-size:13px;
    color:var(--ink-dim);
}

.card h2 + .sub{
    margin-top:2px;
}

/* ---- card collapsible header ---- */

.card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
}

.collapse-btn{
    flex:0 0 auto;
    width:32px;
    height:32px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line);
    border-radius:10px;
    background:transparent;
    color:var(--ink-dim);
    cursor:pointer;
    transition:border-color .2s, background .2s, color .2s;
}

.collapse-btn:hover{
    border-color:var(--moon);
    background:var(--moon-soft);
    color:var(--ink);
}

.collapse-btn svg{
    width:16px;
    height:16px;
    transition:transform .25s ease;
}

.collapse-btn.is-collapsed svg{
    transform:rotate(180deg);
}

.card-body{
    overflow:hidden;
    transition:max-height .25s ease, opacity .2s ease;
}

.card-body.is-collapsed{
    opacity:0;
    pointer-events:none;
}

/* ---- form controls ---- */

select, .hostMsgInput{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    background:#0e1320;
    color:var(--ink);
    font-size:14px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
    appearance:none;
}

select:focus, .hostMsgInput:focus{
    border-color:var(--moon);
    box-shadow:0 0 0 3px var(--moon-soft);
}

select{
    background-image:
        linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),
        linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position:
        calc(100% - 18px) center,
        calc(100% - 13px) center;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    cursor:pointer;
}

/* buttons */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 18px;
    border:none;
    border-radius:var(--r-sm);
    background:linear-gradient(135deg,#7c5cff,#5b3df0);
    color:#fff;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s, filter .15s;
    box-shadow:0 4px 18px rgba(124,92,255,.28);
}

.btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.btn:active{
    transform:translateY(0);
}

.btn-block{
    width:100%;
}

.btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    box-shadow:none;
    color:var(--ink);
}

.btn-ghost:hover{
    border-color:var(--moon);
    background:var(--moon-soft);
}

.btn-danger{
    background:linear-gradient(135deg,#ef4444,#b91c1c);
    box-shadow:0 4px 18px rgba(239,68,68,.28);
}

/* role picker row */

.role-picker{
    display:flex;
    gap:10px;
    margin-bottom:14px;
}

.role-picker select{
    flex:1;
}

.role-picker .btn{
    width:auto;
    padding:12px 20px;
    white-space:nowrap;
}

/* role chips */

.roleConfigList{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.roleBox{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:#0e1320;
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    padding:10px 14px;
    animation:rise .3s ease both;
}

.roleBox .name{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:500;
}

.roleBox .role-icon{
    width:28px;
    height:28px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--line);
    background:#0a0e18;
    flex-shrink:0;
}

.roleBox .count{
    font-family:"JetBrains Mono",monospace;
    color:var(--moon);
    font-size:13px;
}

.roleBox .btns{
    display:flex;
    gap:6px;
}

.roleBtn{
    width:30px;
    height:30px;
    padding:0;
    border:1px solid var(--line);
    border-radius:8px;
    background:#1a2133;
    color:var(--ink);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
    display:flex;
    align-items:center;
    justify-content:center;
}

.roleBtn:hover{
    border-color:var(--moon);
    color:#fff;
    background:var(--moon-soft);
}

.empty-note{
    font-size:13px;
    color:var(--ink-dim);
    padding:14px;
    border:1px dashed var(--line);
    border-radius:var(--r-sm);
    text-align:center;
}

/* role count badge */

.config-summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:.05em;
}

.config-summary b{
    color:var(--ink);
    font-weight:700;
}

/* ---- players grid ---- */

.players-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
}

.player{
    background:#0e1320;
    border:1px solid var(--line);
    border-radius:var(--r-md);
    padding:16px;
    transition:border-color .2s, transform .2s;
    animation:rise .35s ease both;
}

.player:hover{
    border-color:rgba(124,92,255,.35);
}

.player.dead{
    opacity:.5;
    filter:grayscale(60%);
}

.player .ptop{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    margin-bottom:4px;
}

.player .pname{
    font-weight:600;
    font-size:15px;
    color:#fff;
}

.player .prole{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--moon);
    background:var(--moon-soft);
    border:1px solid rgba(124,92,255,.3);
    border-radius:999px;
    padding:3px 10px;
    white-space:nowrap;
}

.randomRole{
    margin-top:6px;
    font-size:12px;
    color:#60a5fa;
}

.realRole{
    margin-top:4px;
    font-size:12px;
    color:var(--mark);
    font-weight:600;
}

.huntInfo{
    margin-top:6px;
    font-size:12px;
    color:var(--wolf);
    font-weight:600;
}

.selectionInfo{
    margin-top:10px;
    font-size:12px;
    color:var(--ink-dim);
    padding:6px 10px;
    border-radius:8px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
}

.flags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.flag{
    font-size:11px;
    padding:3px 9px;
    border-radius:999px;
    font-weight:600;
    letter-spacing:.02em;
}

.flag.protect{ background:var(--safe-soft); color:var(--safe); border:1px solid rgba(34,197,94,.3); }
.flag.killed{ background:var(--wolf-soft); color:var(--wolf); border:1px solid rgba(239,68,68,.3); }
.flag.silenced{ background:rgba(148,163,184,.14); color:#94a3b8; border:1px solid rgba(148,163,184,.3); }
.flag.transformed{ background:var(--mark-soft); color:var(--mark); border:1px solid rgba(251,191,36,.3); }

/* preset messages */

.roleMessages{
    margin-top:12px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.presetBtn{
    font-size:12px;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid rgba(124,92,255,.35);
    background:var(--moon-soft);
    color:#cdbfff;
    cursor:pointer;
    transition:.15s;
    font-family:"IBM Plex Sans Thai",sans-serif;
}

.presetBtn:hover{
    background:var(--moon);
    color:#fff;
    border-color:var(--moon);
}

/* toggles */

.toggles{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
}

.toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--ink-dim);
    cursor:pointer;
    user-select:none;
}

.toggle input{
    appearance:none;
    width:16px;
    height:16px;
    border:1px solid var(--line);
    border-radius:5px;
    background:#1a2133;
    cursor:pointer;
    position:relative;
    transition:.15s;
    flex-shrink:0;
}

.toggle input:checked{
    background:var(--moon);
    border-color:var(--moon);
}

.toggle input:checked::after{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:#fff;
}

.toggle:hover{
    color:var(--ink);
}

/* ---- chat ---- */

.chat-controls{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:10px;
}

.chat-controls select{
    width:100%;
}

.chat-controls .chat-input-row{
    display:flex;
    gap:8px;
    align-items:center;
}

.chat-controls input{
    flex:1;
}

.chat-controls .chat-input-row .btn{
    flex:0 0 72px;
    padding:12px 10px;
}

.chat-log{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:320px;
    overflow-y:auto;
    padding-right:4px;
}

.chat-log:empty::after{
    content:"ยังไม่มีข้อความ — ส่งข้อความแรกของคืนนี้";
    display:block;
    text-align:center;
    color:var(--ink-dim);
    font-size:13px;
    padding:24px 0;
    border:1px dashed var(--line);
    border-radius:var(--r-sm);
}

.msg{
    border-radius:var(--r-sm);
    padding:10px 12px;
    font-size:13px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.02);
    animation:rise .25s ease both;
}

.msg.wolf{
    background:var(--wolf-soft);
    border-color:rgba(239,68,68,.25);
}

.msg.global{
    background:rgba(59,130,246,.12);
    border-color:rgba(59,130,246,.25);
}

.msg.private{
    background:var(--safe-soft);
    border-color:rgba(34,197,94,.3);
}

.msg.host{
    background:var(--moon-soft);
    border-color:rgba(124,92,255,.3);
}

.msg .mname{
    font-weight:700;
    color:#fff;
    margin-bottom:2px;
    font-size:12px;
}

.msg .mtype{
    margin-top:4px;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
}

/* ---- chat tabs (host) ---- */

.chat-tabs{
    display:flex;
    gap:6px;
    margin-bottom:12px;
}

.chat-tab{
    flex:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:9px 14px;
    border-radius:var(--r-sm);
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
    box-shadow:none;
    width:auto;
}

.chat-tab:hover{
    border-color:var(--moon);
    background:var(--moon-soft);
    color:var(--ink);
    transform:none;
    filter:none;
}

.chat-tab.active-global{
    border-color:rgba(59,130,246,.5);
    background:rgba(59,130,246,.12);
    color:#93c5fd;
}

.chat-tab.active-wolf{
    border-color:rgba(239,68,68,.5);
    background:var(--wolf-soft);
    color:#fca5a5;
}

.chat-tab .tab-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:18px;
    height:18px;
    padding:0 5px;
    border-radius:999px;
    font-size:10px;
    font-weight:700;
    font-family:"JetBrains Mono",monospace;
    background:rgba(255,255,255,.12);
    color:#fff;
    line-height:1;
}

.chat-tab.active-global .tab-badge{ background:rgba(59,130,246,.35); }
.chat-tab.active-wolf .tab-badge{ background:rgba(239,68,68,.35); }

.chat-box{
    display:none;
}

.chat-box.visible{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.btn-vote{
    background:linear-gradient(135deg,#f59e0b,#d97706);
    box-shadow:0 4px 18px rgba(245,158,11,.28);
}

.btn-vote.active{
    background:linear-gradient(135deg,#22c55e,#15803d);
    box-shadow:0 4px 18px rgba(34,197,94,.3);
    animation:glowPulse 2s infinite;
}

.vote-panel{
    margin-top:16px;
    padding:14px;
    background:rgba(245,158,11,.07);
    border:1px solid rgba(245,158,11,.25);
    border-radius:var(--r-md);
}

.vote-panel.active{
    background:rgba(34,197,94,.07);
    border-color:rgba(34,197,94,.25);
}

.vote-panel-title{
    font-size:12px;
    font-family:"JetBrains Mono",monospace;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:10px;
}

.vote-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 12px;
    background:#0e1320;
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    margin-bottom:6px;
    font-size:13px;
}

.vote-row .vote-name{
    font-weight:600;
    color:#fff;
}

.vote-row .vote-target{
    color:var(--ink-dim);
    font-size:12px;
}

.vote-tally{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
}

.tally-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 12px;
    border-radius:var(--r-sm);
    margin-bottom:5px;
    font-size:13px;
    background:#0e1320;
    border:1px solid var(--line);
}

.tally-count{
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
    font-weight:700;
    padding:2px 10px;
    border-radius:999px;
    background:rgba(239,68,68,.15);
    color:var(--wolf);
    border:1px solid rgba(239,68,68,.3);
}

.tally-row.top-voted{
    border-color:rgba(239,68,68,.4);
    background:rgba(239,68,68,.07);
}


    margin-top:4px;
}

.divider{
    height:1px;
    background:var(--line);
    margin:18px 0;
    border:none;
}

/* ---- floating bottom bar ---- */

.floating-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:60;
    display:flex;
    justify-content:flex-start;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));
    background:rgba(10,13,20,.78);
    border-top:1px solid var(--line);
    backdrop-filter:blur(14px);
}

.floating-bar .btn-vote{
    width:auto;
    min-width:200px;
}

/* ---- vote popup ---- */

.vote-modal-overlay{
    position:fixed;
    inset:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(5,7,13,.66);
    backdrop-filter:blur(3px);
}

.vote-modal-overlay.hidden{
    display:none;
}

.vote-modal{
    position:relative;
    width:100%;
    max-width:420px;
    max-height:80vh;
    overflow-y:auto;
    padding:22px;
    background:var(--panel-solid);
    border:1px solid rgba(245,158,11,.3);
    border-radius:var(--r-lg);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    animation:rise .3s ease both;
}

.vote-modal.active{
    border-color:rgba(34,197,94,.3);
}

.vote-modal-close{
    position:absolute;
    top:14px;
    right:14px;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;

    border:1px solid var(--line);

}

html.modal-open body{

}

</style>

</head>
<body>

<div class="app">

    <!-- ===== SEAL / ROOM CODE ===== -->
    <div class="seal-wrap">
        <div class="eyebrow">ห้องควบคุมผู้เล่าเรื่อง</div>
        <div class="seal">
            <span class="seal-label">รหัสห้อง</span>
            <span class="seal-code" id="room">••••</span>
        </div>
        <div class="seal-hint">บอกรหัสนี้กับผู้เล่นเพื่อเข้าร่วมห้อง</div>
    </div>

    <div class="layout">

        <!-- ===== LEFT COLUMN ===== -->
        <div class="col">

            <div class="card">
                <div class="card-head">
                    <div>
                        <h2>ตั้งค่าบทบาท</h2>
                        <p class="sub">เลือกบทบาทและจำนวนให้ตรงกับผู้เล่นในห้อง</p>
                    </div>
                    <button class="collapse-btn" id="roleCollapseBtn" onclick="toggleRoleCard()" aria-label="ย่อ/ขยายการ์ดตั้งค่าบทบาท" aria-expanded="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                </div>

                <div class="card-body" id="roleCardBody">

                    <div class="role-picker">
                        <select id="roleSelect"></select>
                        <button class="btn" onclick="addRole()">+ เพิ่ม</button>
                    </div>

                    <div class="config-summary">
                        <span>รายการบทบาท</span>
                        <span>รวม <b id="roleTotal">0</b> ใบ</span>
                    </div>

                    <div id="roles" class="roleConfigList"></div>

                    <hr class="divider">

                    <button class="btn btn-block" onclick="startGame()">
                        🌙 เริ่มเกม
                    </button>

                </div>
            </div>

        </div>

        <!-- ===== RIGHT COLUMN ===== -->
        <div class="col">

            <div class="card">
                <h2>ผู้เล่นในห้อง</h2>
                <p class="sub">แตะปุ่มสถานะเพื่ออัปเดตให้ผู้เล่นเห็นทันที</p>

                <div id="list" class="players-grid"></div>
            </div>

            <div class="card sticky">
                <h2>แชท</h2>
                <p class="sub">ผู้เล่าเรื่องเห็นทุกแชท — รวม, หมาป่า, และส่วนตัว</p>

                <!-- TABS -->
                <div class="chat-tabs">
                    <button class="chat-tab active-global" id="tabGlobal" onclick="switchHostTab('global')">
                        🔵 แชทรวม
                        <span class="tab-badge" id="badgeGlobal">0</span>
                    </button>
                    <button class="chat-tab" id="tabWolf" onclick="switchHostTab('wolf')">
                        🔴 หมาป่า
                        <span class="tab-badge" id="badgeWolf">0</span>
                    </button>
                </div>

                <!-- INPUT -->
                <div class="chat-controls">
                    <div class="chat-input-row">
                        <input
                            id="hostMsg"
                            class="hostMsgInput"
                            placeholder="พิมพ์ข้อความจากผู้เล่าเรื่อง..."
                        >
                        <button class="btn" onclick="sendHostMsg()">ส่ง</button>
                    </div>
                </div>

                <!-- CHAT BOXES -->
                <div id="chatBoxGlobal" class="chat-log chat-box visible"></div>
                <div id="chatBoxWolf" class="chat-log chat-box"></div>
            </div>

        </div>

    </div>

</div>

<!-- ===== FLOATING BAR ===== -->
<div class="floating-bar">
    <button class="btn btn-vote" id="voteBtn" onclick="toggleVoteMode()">
        🗳️ เปิดโหมดโหวต
    </button>
</div>

<!-- ===== VOTE POPUP ===== -->
<div class="vote-modal-overlay hidden" id="voteModalOverlay">
    <div class="vote-modal" id="votePanel">
        <button class="vote-modal-close" onclick="toggleVoteMode()" aria-label="ปิดหน้าต่างโหวต">✕</button>
        <div class="vote-panel-title">📋 การโหวต</div>
        <div id="voteRows"></div>
        <div class="vote-tally" id="voteTally"></div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>


<script>

const socket = io();

let roomId = "";
let currentRoom = null;


const roleConfig = {};

const hostName = "Admin676767";

let roles = {}; // cache ฝั่ง client

// ดึง icon ของอาชีพจาก roles ที่เซิร์ฟเวอร์ส่งมา (roles_data) ถ้าไม่มีใช้รูป default
function getRoleIcon(role) {
    return (roles[role] && roles[role].icon) || "/images/default-role.jpg";
}

// พรีโหลดรูปไอคอนอาชีพทั้งหมดล่วงหน้า กันรูปกระตุก/เด้งช้าตอนเพิ่มอาชีพจริงๆ
const preloadedIcons = new Set();
function preloadRoleImages(rolesData) {
    Object.values(rolesData || {}).forEach((info) => {
        const src = info && info.icon;
        if (!src || preloadedIcons.has(src)) return;
        preloadedIcons.add(src);
        const img = new Image();
        img.src = src;
    });
}

socket.on("roles_data", (data) => {

    // เก็บข้อมูล roles ทั้งหมดไว้ใช้ทั้งระบบ
    roles = data || {};
    preloadRoleImages(roles);

    const select = document.getElementById("roleSelect");

    if (!select) return; // กัน DOM ไม่พร้อม

    select.innerHTML = "";

    Object.keys(roles).forEach((role) => {

        const opt = document.createElement("option");
        opt.value = role;
        opt.textContent = role;

        select.appendChild(opt);

    });

});


// CREATE ROOM
socket.emit(
    "create_room",
    { name: hostName },
    (id) => {
        roomId = id;
        document.getElementById("room").innerText = id;
document.getElementById("room").onclick = () => {
    navigator.clipboard.writeText(roomId);
};
    }
);

// ROOM UPDATE (SOURCE OF TRUTH)
socket.on("room_update", (room) => {

    currentRoom = room;

    const list = document.getElementById("list");

    if (room.players.filter(p => !p.isHost).length === 0) {
        list.innerHTML = `<div class="empty-note">ยังไม่มีผู้เล่นเข้าร่วมห้องนี้</div>`;
    } else {

        // เคลียร์ empty-note ค้าง (ถ้ามี) ก่อน sync ของจริง
        if (list.querySelector(".empty-note")) {
            list.innerHTML = "";
        }

        // เก็บการ์ดผู้เล่นเดิมไว้ใช้ซ้ำ แทนรื้อสร้างใหม่ทั้งลิสต์ทุกครั้งที่ติ๊กสถานะ
        // (เดิมพอติ๊กคนใดคนหนึ่ง การ์ดของผู้เล่น "ทุกคน" จะถูกรื้อสร้างใหม่หมด ทำให้กระตุก)
        const existingCards = {};
        list.querySelectorAll(".player[data-id]").forEach((node) => {
            existingCards[node.dataset.id] = node;
        });
        const seenIds = new Set();

        room.players.forEach((p, idx) => {
            seenIds.add(p.id);
            const roleData = roles?.[p.role] || {};

            let div = existingCards[p.id];
            if (!div) {
                div = document.createElement("div");
                div.setAttribute("data-id", p.id);
            }

            div.className = "player " + (!p.alive ? "dead" : "");

            const newHTML = `

                <div class="ptop">
                    <span class="pname">${p.name}</span>
                    <span class="prole">${p.role || "?"}</span>
                </div>

                ${
                    p.displayRole && p.displayRole !== p.role
                    ? `
                        <div class="randomRole">สุ่มจาก: ${p.displayRole}</div>
                        <div class="realRole">บทจริง: ${p.role}</div>
                    `
                    : ""
                }

                ${
                    p.huntTarget
                    ? `<div class="huntInfo">🎯 เป้าหมาย: ${p.huntTarget}</div>`
                    : ""
                }

                <div class="selectionInfo" id="sel-${p.id}">
                    ยังไม่เลือก
                </div>

                ${
                    (p.protected || p.killed || p.silenced || p.transformed)
                    ? `
                        <div class="flags">
                            ${p.protected ? `<span class="flag protect">🛡 ถูกปกป้อง</span>` : ""}
                            ${p.killed ? `<span class="flag killed">☠ ถูกเล็งฆ่า</span>` : ""}
                            ${p.silenced ? `<span class="flag silenced">🤐 โดนใบ้</span>` : ""}
                            ${p.transformed ? `<span class="flag transformed">🐺 กลายร่างแล้ว</span>` : ""}
                        </div>
                    `
                    : ""
                }

                ${
                    roleData?.messages?.length
                    ? `
                        <div class="roleMessages">
                            ${roleData.messages.map(msg => `
                                <button class="presetBtn" onclick="sendPreset('${p.id}', \`${msg}\`)">
                                    ${msg}
                                </button>
                            `).join("")}
                        </div>
                    `
                    : ""
                }

                <div class="toggles">

                    <label class="toggle">
                        <input type="checkbox"
                            onchange="toggle('${p.id}','alive', this.checked)"
                            ${p.alive ? "checked" : ""}
                        >
                        มีชีวิต
                    </label>

                    <label class="toggle">
                        <input type="checkbox"
                            onchange="toggle('${p.id}','protected', this.checked)"
                            ${p.protected ? "checked" : ""}
                        >
                        ปกป้อง
                    </label>

                    <label class="toggle">
                        <input type="checkbox"
                            onchange="toggle('${p.id}','killed', this.checked)"
                            ${p.killed ? "checked" : ""}
                        >
                        เล็งฆ่า
                    </label>

                    <label class="toggle">
                        <input type="checkbox"
                            onchange="toggle('${p.id}','silenced', this.checked)"
                            ${p.silenced ? "checked" : ""}
                        >
                        ใบ้
                    </label>

                    <label class="toggle">
                        <input type="checkbox"
                            onchange="toggle('${p.id}','transformed', this.checked)"
                            ${p.transformed ? "checked" : ""}
                        >
                        กลายร่าง
                    </label>

                </div>

            `;

            // อัปเดต DOM เฉพาะการ์ดที่ข้อมูลเปลี่ยนจริงๆ การ์ดคนอื่นที่ไม่เปลี่ยนจะไม่ถูกแตะเลย
            if (div.innerHTML !== newHTML) {
                div.innerHTML = newHTML;
            }

            if (list.children[idx] !== div) {
                list.insertBefore(div, list.children[idx] || null);
            }
        });

        // ลบการ์ดของผู้เล่นที่ไม่อยู่ในห้องแล้ว (หลุดห้อง/ตัดการเชื่อมต่อ)
        Object.keys(existingCards).forEach((id) => {
            if (!seenIds.has(id)) {
                existingCards[id].remove();
            }
        });
    }


    const selectedTargets = room.selectedTargets || {};

    // reset UI
    document.querySelectorAll(".selectionInfo").forEach(el => {
        el.innerText = "ยังไม่เลือก";
    });

    // render selection map
    Object.entries(selectedTargets).forEach(([fromId, targetId]) => {

        const targetPlayer = room.players.find(p => p.id === targetId);
        const box = document.getElementById(`sel-${fromId}`);

        if (box) {
            box.innerText = `📍 เลือก: ${targetPlayer ? targetPlayer.name : "?"}`;
        }

    });

    // ===== VOTE MODE =====
    voteMode = !!room.voteMode;
    const voteBtn = document.getElementById("voteBtn");
    const voteModalOverlay = document.getElementById("voteModalOverlay");
    const votePanel = document.getElementById("votePanel");

    if (voteMode) {
        voteBtn.textContent = "🛑 ปิดโหมดโหวต";
        voteBtn.classList.add("active");
        voteModalOverlay.classList.remove("hidden");
        votePanel.classList.add("active");
        document.documentElement.classList.add("modal-open");
        document.body.classList.add("modal-open");
    } else {
        voteBtn.textContent = "🗳️ เปิดโหมดโหวต";
        voteBtn.classList.remove("active");
        voteModalOverlay.classList.add("hidden");
        votePanel.classList.remove("active");
        document.documentElement.classList.remove("modal-open");
        document.body.classList.remove("modal-open");
    }

    const votes = room.votes || {};
    const players = room.players.filter(p => !p.isHost);

    // render who voted for whom
    const voteRows = document.getElementById("voteRows");
    voteRows.innerHTML = "";

    players.forEach(p => {
        if (!p.alive) return;
        const targetId = votes[p.id];
        const target = targetId ? room.players.find(x => x.id === targetId) : null;
        const row = document.createElement("div");
        row.className = "vote-row";
        row.innerHTML = `
            <span class="vote-name">${p.name}</span>
            <span class="vote-target">${target ? `➜ ${target.name}` : "ยังไม่โหวต"}</span>
        `;
        voteRows.appendChild(row);
    });

    // tally
    const tally = {};
    Object.values(votes).forEach(tid => {
        tally[tid] = (tally[tid] || 0) + 1;
    });

    const maxVote = Math.max(0, ...Object.values(tally));

    const tallyDiv = document.getElementById("voteTally");
    tallyDiv.innerHTML = "";

    if (Object.keys(tally).length === 0) {
        tallyDiv.innerHTML = `<div style="font-size:12px;color:var(--ink-dim);text-align:center;padding:8px 0;">ยังไม่มีการโหวต</div>`;
    } else {
        // sort by votes desc
        const sorted = Object.entries(tally).sort((a,b) => b[1]-a[1]);
        sorted.forEach(([tid, count]) => {
            const pl = room.players.find(x => x.id === tid);
            const row = document.createElement("div");
            row.className = "tally-row" + (count === maxVote ? " top-voted" : "");
            row.innerHTML = `
                <span>${pl ? pl.name : "?"}</span>
                <span class="tally-count">${count} โหวต</span>
            `;
            tallyDiv.appendChild(row);
        });
    }

});

// HOST ERROR
socket.on(
    "host_error",
    (msg) => {

        alert(msg);

    }
);

// ROLE UI
function renderRoles() {

    const rolesDiv = document.getElementById("roles");

    // ลบอาชีพที่เหลือ 0 หรือต่ำกว่าออกจาก config ก่อน
    Object.keys(roleConfig).forEach((role) => {
        if (roleConfig[role] <= 0) {
            delete roleConfig[role];
        }
    });

    const roleNames = Object.keys(roleConfig);
    let total = 0;
    roleNames.forEach((role) => { total += roleConfig[role]; });

    document.getElementById("roleTotal").innerText = total;

    if (roleNames.length === 0) {
        rolesDiv.innerHTML = `<div class="empty-note">ยังไม่ได้เลือกบทบาท — เริ่มจากเลือกจากเมนูด้านบน</div>`;
        return;
    }

    // ถ้ามี empty-note ค้างอยู่ ให้เคลียร์ก่อน sync ของจริง
    if (rolesDiv.querySelector(".empty-note")) {
        rolesDiv.innerHTML = "";
    }

    // เก็บกล่องอาชีพที่มีอยู่แล้วไว้ใช้ซ้ำ (ตาม role) แทนการรื้อสร้างใหม่ทุกครั้ง
    // กันไม่ให้รูป/อนิเมชันของกล่องที่ "ไม่ได้เปลี่ยน" กระตุกซ้ำตอนกดเพิ่ม/ลดอาชีพอื่น
    const existingNodes = {};
    rolesDiv.querySelectorAll(".roleBox[data-role]").forEach((node) => {
        existingNodes[node.dataset.role] = node;
    });

    roleNames.forEach((role, idx) => {

        let div = existingNodes[role];

        if (!div) {
            // อาชีพใหม่ที่ยังไม่มีกล่อง → สร้างใหม่ (จะเล่นอนิเมชัน rise ตอนเข้ามาจริงๆ)
            div = document.createElement("div");
            div.className = "roleBox";
            div.dataset.role = role;

            div.innerHTML = `
                <div class="name">
                    <img class="role-icon" src="${getRoleIcon(role)}" alt="${role}" onerror="this.style.display='none'">
                    <span>${role}</span>
                    <span class="count"></span>
                </div>
                <div class="btns">
                    <button class="roleBtn" onclick="changeRole('${role}', 1)" aria-label="เพิ่ม ${role}">+</button>
                    <button class="roleBtn" onclick="changeRole('${role}', -1)" aria-label="ลด ${role}">−</button>
                </div>
            `;
        }

        // อัปเดตแค่ตัวเลขจำนวน ไม่แตะรูป/ปุ่มของกล่องเดิม เพื่อไม่ให้รีโหลด/เล่นอนิเมชันซ้ำ
        const countSpan = div.querySelector(".count");
        const countText = `x${roleConfig[role]}`;
        if (countSpan.textContent !== countText) {
            countSpan.textContent = countText;
        }

        // จัดลำดับกล่องให้ตรงกับลำดับที่เลือก/เพิ่มไว้
        if (rolesDiv.children[idx] !== div) {
            rolesDiv.insertBefore(div, rolesDiv.children[idx] || null);
        }
    });

    // ลบกล่องอาชีพที่ถูกลดจนหมดออกจากหน้าจริง
    Object.keys(existingNodes).forEach((role) => {
        if (!roleConfig[role]) {
            existingNodes[role].remove();
        }
    });

}

// ADD ROLE
function addRole() {

    const role =
        document.getElementById(
            "roleSelect"
        ).value;

    if (!roleConfig[role]) {

        roleConfig[role] = 1;

    }

    else {

        roleConfig[role]++;

    }

    renderRoles();

    updateConfig();

}

// CHANGE ROLE
function changeRole(
    role,
    amount
) {

    if (
        !roleConfig[role]
    ) return;

    roleConfig[role] += amount;

    if (
        roleConfig[role] <= 0
    ) {

        delete roleConfig[
            role
        ];

    }

    renderRoles();

    updateConfig();

}

// UPDATE CONFIG
function updateConfig() {

    socket.emit(
        "update_config",
        {
            roomId,
            config: roleConfig
        }
    );

}

// START GAME
function startGame() {

    // ล้างแชทรอบก่อน
    document.getElementById("chatBoxGlobal").innerHTML = "";
    document.getElementById("chatBoxWolf").innerHTML = "";
    hostBadgeCounts = { global: 0, wolf: 0 };
    document.getElementById("badgeGlobal").textContent = "0";
    document.getElementById("badgeWolf").textContent = "0";

    socket.emit(
        "start_game",
        roomId
    );

}

// TOGGLE
function toggle(playerId, key, value) {

    socket.emit(
        "toggle_state",
        {
            roomId,
            playerId,
            key,
            value
        }
    );

}
// HOST CHAT TAB
let currentHostTab = "global";
let hostBadgeCounts = { global: 0, wolf: 0 };

function switchHostTab(tab) {
    currentHostTab = tab;

    // update tab active state
    document.getElementById("tabGlobal").className =
        "chat-tab" + (tab === "global" ? " active-global" : "");
    document.getElementById("tabWolf").className =
        "chat-tab" + (tab === "wolf" ? " active-wolf" : "");

    // show/hide boxes
    document.getElementById("chatBoxGlobal").classList.toggle("visible", tab === "global");
    document.getElementById("chatBoxWolf").classList.toggle("visible", tab === "wolf");

    // reset badge for active tab
    hostBadgeCounts[tab] = 0;
    document.getElementById(tab === "global" ? "badgeGlobal" : "badgeWolf").textContent = "0";

    // scroll to bottom of active box
    const box = document.getElementById(tab === "global" ? "chatBoxGlobal" : "chatBoxWolf");
    box.scrollTop = box.scrollHeight;
}

function sendHostMsg() {

    const text =
        document.getElementById(
            "hostMsg"
        ).value
        .trim();

    const type = currentHostTab;

    if (!text) return;

    socket.emit(
        "host_chat",
        {
            roomId,
            text,
            type
        }
    );

    document.getElementById(
        "hostMsg"
    ).value = "";

}
function sendPreset(
    playerId,
    text
) {

    socket.emit(
        "host_private_msg",
        {
            roomId,
            playerId,
            text
        }
    );

}

// ENTER SEND
document.getElementById("hostMsg").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        sendHostMsg();
    }
});

socket.on("chat_message", (data) => {

    // route to correct box
    const isWolf = data.type === "wolf";
    const boxId = isWolf ? "chatBoxWolf" : "chatBoxGlobal";
    const log = document.getElementById(boxId);

    const div = document.createElement("div");

    let cls = "msg ";
    if (data.type === "private") cls += "private";
    else if (data.isHost) cls += "host";
    else if (data.type === "wolf") cls += "wolf";
    else cls += "global";

    div.className = cls;

    const typeLabel =
        data.type === "private" ? "🟢 PRIVATE" :
        data.type === "wolf" ? "🔴 หมาป่า" :
        data.isHost ? "🟣 ผู้เล่าเรื่อง" :
        "🔵 แชทรวม";

    div.innerHTML = `
        <div class="mname">${data.name}</div>
        <div>${data.text}</div>
        <div class="mtype">${typeLabel}</div>
    `;

    log.appendChild(div);
    log.scrollTop = log.scrollHeight;

    // update badge if tab not active
    const tabKey = isWolf ? "wolf" : "global";
    if (currentHostTab !== tabKey) {
        hostBadgeCounts[tabKey] = (hostBadgeCounts[tabKey] || 0) + 1;
        const badgeEl = document.getElementById(tabKey === "wolf" ? "badgeWolf" : "badgeGlobal");
        badgeEl.textContent = hostBadgeCounts[tabKey];
    }

});

// TOGGLE VOTE MODE
let voteMode = false;
function toggleVoteMode() {
    socket.emit("toggle_vote_mode", { roomId });
}

// TOGGLE ROLE CARD (เปิด/ปิดการ์ดตั้งค่าบทบาท)
function toggleRoleCard() {

    const body = document.getElementById("roleCardBody");
    const btn = document.getElementById("roleCollapseBtn");
    const isCollapsed = body.classList.contains("is-collapsed");

    if (isCollapsed) {
        // เปิด: ขยายกลับไปตามความสูงจริงของเนื้อหา
        body.classList.remove("is-collapsed");
        body.style.maxHeight = body.scrollHeight + "px";
        btn.classList.remove("is-collapsed");
        btn.setAttribute("aria-expanded", "true");

        body.addEventListener("transitionend", function clearMaxHeight(e) {
            if (e.propertyName === "max-height") {
                body.style.maxHeight = "none";
                body.removeEventListener("transitionend", clearMaxHeight);
            }
        });
    } else {
        // ปิด: ล็อกความสูงปัจจุบันก่อน แล้วค่อยยุบลงเป็น 0 เพื่อให้มีอนิเมชัน
        body.style.maxHeight = body.scrollHeight + "px";

        requestAnimationFrame(() => {
            body.classList.add("is-collapsed");
            body.style.maxHeight = "0px";
        });

        btn.classList.add("is-collapsed");
        btn.setAttribute("aria-expanded", "false");
    }

}

// initial empty-state render
renderRoles();
