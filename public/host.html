<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Werewolf Host</title>

<style>

body{
    margin:0;
    padding:20px;
    background:
    linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=1200&auto=format&fit=crop");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
    font-family:sans-serif;
    min-height:100vh;
}

.card{
    background:rgba(20,20,20,.82);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border-radius:24px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:
    0 0 25px rgba(0,0,0,.45),
    0 0 50px rgba(124,58,237,.12);
    animation:fade .5s ease;
}

h1{
    margin-top:0;
    font-size:40px;
    letter-spacing:2px;
    color:white;
}

h2{
    color:#d1d5db;
    margin-bottom:14px;
}

button{
    padding:12px 16px;
    border:none;
    border-radius:14px;
    background:
    linear-gradient(135deg,#7c3aed,#4f46e5);
    color:white;
    cursor:pointer;
    margin:5px;
    font-weight:bold;
    transition:.25s;
    box-shadow:0 0 18px rgba(124,58,237,.35);
}


button:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 0 28px rgba(124,58,237,.65);
}

select{
    padding:12px;
    border:none;
    border-radius:14px;
    background:#1f2937;
    color:white;
    font-size:15px;
    outline:none;
    margin-bottom:10px;
}

.player{
    background:rgba(55,65,81,.78);
    border:1px solid rgba(255,255,255,.05);
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
    transition:.25s;
}

.player:hover{
    transform:translateY(-2px);
    background:rgba(75,85,99,.88);
}

.dead{
    opacity:.45;
    filter:grayscale(100%);
}

.roleBox{
    display:flex;
    align-items:center;
    justify-content:space-between;

    width:100%;
    max-width:250px; /* ปรับความยาวกล่อง */

    background:rgba(55,65,81,.75);
    border-radius:16px;

    padding:10px 14px; /* ปรับความอ้วนกล่อง */

    margin-top:10px;

    border:1px solid rgba(255,255,255,.05);
}

.roleBtn{
    width:34px; /* ขนาดปุ่ม */
    height:34px;

    padding:0;
    margin:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:10px;

    background:
    linear-gradient(135deg,#7c3aed,#4f46e5);

    color:white;

    font-size:18px; /* ขนาด + - */

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.roleBtn:hover{
    transform:scale(1.08);
}


.realRole{
    color:#facc15;
    margin-top:8px;
    font-size:14px;
    font-weight:bold;
}

.randomRole{
    color:#60a5fa;
    margin-top:6px;
    font-size:14px;
}

#room{
    color:#c084fc;
    text-shadow:0 0 12px rgba(192,132,252,.8);
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#4f46e5;
    border-radius:20px;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}
.msgPrivate{
    background:
    rgba(34,197,94,.15);

    border:
    1px solid
    rgba(34,197,94,.25);
}
</style>

</head>
<body>

<div class="card">

    <h1>สร้างเกม</h1>

    <h2>
        ห้อง:
        <span id="room">...</span>
    </h2>

</div>

<div class="card">

    <h2>ตั้งค่าบทบาท</h2>

   <select id="roleSelect"></select>

    <button onclick="addRole()">
        เพิ่มบทบาท
    </button>

    <div id="roles"></div>

    <br>

    <button onclick="startGame()">
        เริ่มเกม
    </button>

</div>

<div class="card">

    <h2>ผู้เล่น</h2>

    <div id="list"></div>

</div>
<div class="card">

    <h2>
        แชท
    </h2>

    <select id="chatType">

        <option value="global">
            แชทรวม
        </option>

        <option value="wolf">
            เฉพาะหมาป่า
        </option>

    </select>

    <input
        id="hostMsg"
        placeholder="ข้อความจากโฮสต์..."
    >

    <button onclick="sendHostMsg()">
        ส่งข้อความ
    </button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let roomId = "";
let currentRoom = null;


const roleConfig = {};

const hostName = "Admin676767";

let roles = {}; // cache ฝั่ง client

socket.on("roles_data", (data) => {

    // เก็บข้อมูล roles ทั้งหมดไว้ใช้ทั้งระบบ
    roles = data || {};

    const select = document.getElementById("roleSelect");

    if (!select) return; // กัน DOM ไม่พร้อม

    select.innerHTML = "";

    Object.keys(roles).forEach((role) => {

        const opt = document.createElement("option");
        opt.value = role;
        opt.textContent = role;

        select.appendChild(opt);

    });

});


// CREATE ROOM
socket.emit(
    "create_room",
    { name: hostName },
    (id) => {
        roomId = id;
        document.getElementById("room").innerText = id;
    }
);

// ROOM UPDATE (SOURCE OF TRUTH)
socket.on("room_update", (room) => {

    currentRoom = room;

    const list = document.getElementById("list");
    list.innerHTML = "";

    room.players.forEach((p) => {
const roleData = roles?.[p.role] || {};

        const div = document.createElement("div");

        div.className = "player " + (!p.alive ? "dead" : "");
        div.setAttribute("data-id", p.id);

        div.innerHTML = `

    <b>${p.name}</b>

    <br><br>

    ROLE: ${p.role || "?"}

    ${
        p.displayRole && p.displayRole !== p.role
        ? `
            <div class="randomRole">
                สุ่มจาก: ${p.displayRole}
            </div>

            <div class="realRole">
                บทจริง: ${p.role}
            </div>
        `
        : ""
    }

    <div class="selectionInfo" id="sel-${p.id}">
        ยังไม่เลือก
    </div>

    ${
        roleData?.messages?.length
        ? `
            <div class="roleMessages" style="margin-top:8px;">
                ${roleData.messages.map(msg => `
                    <button onclick="sendPreset('${p.id}', \`${msg}\`)">
                        ${msg}
                    </button>
                `).join("")}
            </div>
        `
        : ""
    }

    ${
        p.huntTarget
        ? `
            <div class="realRole">
                🎯 เป้าหมาย: ${p.huntTarget}
            </div>
        `
        : ""
    }

    <br>

    ${p.protected ? "🛡ถูกปกป้อง" : ""}
${p.killed ? "☠ ถูกเล็งฆ่า" : ""}
${p.silenced ? "🤐 โดนใบ้" : ""}
${p.transformed ? "🐺 กลายร่างแล้ว" : ""}

    <div style="display:flex; gap:14px; margin-top:10px;">

        <label>
            <input type="checkbox"
                onchange="toggle('${p.id}','alive', this.checked)"
                ${p.alive ? "checked" : ""}
            >
            Alive
        </label>
  <label>  
        <input type="checkbox"  
            onchange="toggle('${p.id}','protected', this.checked)"  
            ${p.protected ? "checked" : ""}  
        >  
        Protect  
    </label>  

    <label>  
        <input type="checkbox"  
            onchange="toggle('${p.id}','killed', this.checked)"  
            ${p.killed ? "checked" : ""}  
        >  
        Mark  
    </label>  
        <label>
    <input type="checkbox"
        onchange="toggle('${p.id}','silenced', this.checked)"
        ${p.silenced ? "checked" : ""}
    >
    Silence
</label>

<label>
    <input type="checkbox"
        onchange="toggle('${p.id}','transformed', this.checked)"
        ${p.transformed ? "checked" : ""}
    >
    Transform
</label>

    </div>

`;

        list.appendChild(div);
    });


    const selectedTargets = room.selectedTargets || {};

    // reset UI
    document.querySelectorAll(".selectionInfo").forEach(el => {
        el.innerText = "ยังไม่เลือก";
    });

    // render selection map
    Object.entries(selectedTargets).forEach(([fromId, targetId]) => {

        const targetPlayer = room.players.find(p => p.id === targetId);
        const box = document.getElementById(`sel-${fromId}`);

        if (box) {
            box.innerText = `📍 เลือก: ${targetPlayer ? targetPlayer.name : "?"}`;
        }

    });

});


// HOST ERROR
socket.on(
    "host_error",
    (msg) => {

        alert(msg);

    }
);

// ROLE UI
function renderRoles() {

    const rolesDiv =
        document.getElementById(
            "roles"
        );

    rolesDiv.innerHTML = "";

    Object.keys(roleConfig)
    .forEach((role) => {

        if (
            roleConfig[role] <= 0
        ) {

            delete roleConfig[
                role
            ];

            return;

        }

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "roleBox";

        div.innerHTML = `

            <div style="
                display:flex;
                align-items:center;
                gap:10px;
            ">

                <b>
                    ${role}
                </b>

                <span>
                    x${roleConfig[role]}
                </span>

            </div>

            <div style="
                display:flex;
                gap:8px;
            ">

                <button
                    class="roleBtn"
                    onclick="
                    changeRole(
                        '${role}',
                        1
                    )"
                >
                    +
                </button>

                <button
                    class="roleBtn"
                    onclick="
                    changeRole(
                        '${role}',
                        -1
                    )"
                >
                    -
                </button>

            </div>

        `;

        rolesDiv.appendChild(div);

    });

}

// ADD ROLE
function addRole() {

    const role =
        document.getElementById(
            "roleSelect"
        ).value;

    if (!roleConfig[role]) {

        roleConfig[role] = 1;

    }

    else {

        roleConfig[role]++;

    }

    renderRoles();

    updateConfig();

}

// CHANGE ROLE
function changeRole(
    role,
    amount
) {

    if (
        !roleConfig[role]
    ) return;

    roleConfig[role] += amount;

    if (
        roleConfig[role] <= 0
    ) {

        delete roleConfig[
            role
        ];

    }

    renderRoles();

    updateConfig();

}

// UPDATE CONFIG
function updateConfig() {

    socket.emit(
        "update_config",
        {
            roomId,
            config: roleConfig
        }
    );

}

// START GAME
function startGame() {

    socket.emit(
        "start_game",
        roomId
    );

}

// TOGGLE
function toggle(playerId, key, value) {

    socket.emit(
        "toggle_state",
        {
            roomId,
            playerId,
            key,
            value
        }
    );

}
function sendHostMsg() {

    const text =
        document.getElementById(
            "hostMsg"
        ).value
        .trim();

    const type =
        document.getElementById(
            "chatType"
        ).value;

    if (!text) return;

    socket.emit(
        "host_chat",
        {
            roomId,
            text,
            type
        }
    );

    document.getElementById(
        "hostMsg"
    ).value = "";

}
function sendPreset(
    playerId,
    text
) {

    socket.emit(
        "host_private_msg",
        {
            roomId,
            playerId,
            text
        }
    );

}
socket.on("chat_message", (data) => {

    const div = document.createElement("div");

    div.className =
        "player " +
        (data.type === "private" ? "msgPrivate" : "");

    div.innerHTML = `
        <b>${data.name}</b><br>
        ${data.text}
        <br>
        <small>${data.type}</small>
    `;

    document.getElementById("list").prepend(div);

});


</script>

</body>
</html>
