<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Werewolf — Lobby</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0a0d14;
    --panel:#12172380;
    --line:rgba(255,255,255,.07);
    --ink:#dbe0ec;
    --ink-dim:#8993a8;
    --moon:#7c5cff;
    --moon-soft:rgba(124,92,255,.16);
    --wolf:#ef4444;
    --wolf-soft:rgba(239,68,68,.14);
    --r-sm:10px;
    --r-md:16px;
    --r-lg:22px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(ellipse 700px 420px at 20% -8%, rgba(124,92,255,.18), transparent 60%),
        radial-gradient(ellipse 600px 420px at 100% 10%, rgba(239,68,68,.12), transparent 55%),
        var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;
    padding:24px;
    overflow:hidden;
}

/* starfield */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.35), transparent 40%),
        radial-gradient(1px 1px at 78% 8%,  rgba(255,255,255,.25), transparent 40%),
        radial-gradient(1.5px 1.5px at 60% 32%, rgba(255,255,255,.30), transparent 40%),
        radial-gradient(1px 1px at 32% 64%, rgba(255,255,255,.20), transparent 40%),
        radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,.25), transparent 40%),
        radial-gradient(1.5px 1.5px at 8%  85%, rgba(255,255,255,.18), transparent 40%),
        radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,.15), transparent 40%),
        radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,.20), transparent 40%),
        radial-gradient(1px 1px at 70% 55%, rgba(255,255,255,.18), transparent 40%);
    opacity:.55;
    z-index:0;
}

@keyframes rise{
    from{ opacity:0; transform:translateY(16px); }
    to{   opacity:1; transform:translateY(0); }
}

@media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ===== CARD ===== */
.card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    backdrop-filter:blur(14px);
    border-radius:var(--r-lg);
    padding:36px 28px 32px;
    text-align:center;
    animation:rise .6s ease both;
}

/* ===== SEAL / TITLE ===== */
.seal{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:18px 40px;
    border:1px solid var(--moon-soft);
    border-radius:999px;
    background:
        radial-gradient(ellipse at center, rgba(124,92,255,.14), transparent 70%),
        var(--panel);
    margin-bottom:28px;
    position:relative;
}

.seal::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px dashed rgba(124,92,255,.32);
    border-radius:999px;
    pointer-events:none;
}

.seal-eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--ink-dim);
}

.seal-title{
    font-family:"Charm","IBM Plex Sans Thai",serif;
    font-weight:700;
    font-size:46px;
    letter-spacing:.06em;
    color:#fff;
    text-shadow:0 0 32px rgba(124,92,255,.55);
    line-height:1.1;
}

.seal-wolf{
    font-size:30px;
    line-height:1;
    filter:drop-shadow(0 0 10px rgba(239,68,68,.5));
}

/* ===== SUB ===== */
.sub{
    font-size:14px;
    color:var(--ink-dim);
    line-height:1.7;
    margin-bottom:28px;
}

/* ===== BUTTONS ===== */
.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px 20px;
    border:none;
    border-radius:var(--r-md);
    font-family:"IBM Plex Sans Thai",sans-serif;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s, filter .15s, box-shadow .15s;
    margin-bottom:12px;
    text-decoration:none;
    color:#fff;
}

.btn:last-of-type{
    margin-bottom:0;
}

.btn-host{
    background:linear-gradient(135deg, var(--moon), #5b3df0);
    box-shadow:0 4px 22px rgba(124,92,255,.32);
}

.btn-host:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
    box-shadow:0 6px 28px rgba(124,92,255,.48);
}

.btn-player{
    background:#111827;
    border:1px solid var(--line);
    color:var(--ink);
}

.btn-player:hover{
    background:#1a2236;
    border-color:rgba(124,92,255,.3);
    transform:translateY(-2px);
}

.btn:active{
    transform:translateY(0);
}

.btn-icon{
    font-size:20px;
    line-height:1;
}

/* ===== FOOTER ===== */
.footer{
    margin-top:24px;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(137,147,168,.45);
}

</style>
</head>

<body>

<div class="card">

    <div class="seal">
        <span class="seal-wolf">🐺</span>
        <span class="seal-eyebrow">Night Falls</span>
        <span class="seal-title">Werewolf</span>
    </div>

    <p class="sub">
        ระบบจัดการเกมล่ามนุษย์หมาป่า<br>
        Host คุมเกม &nbsp;·&nbsp; Player เล่นผ่านมือถือ
    </p>

    <button class="btn btn-host" onclick="host()">
        <span class="btn-icon">🎮</span>
        Create Game — Host
    </button>

    <button class="btn btn-player" onclick="player()">
        <span class="btn-icon">👤</span>
        Join Game — Player
    </button>

    <div class="footer">Trust nobody. Night starts.</div>

</div>

<script>
function host(){
    window.location.href = "host.html";
}
function player(){
    window.location.href = "player.html";
}
</script>

</body>
</html>
